<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Segoe UI, Inter, system-ui, sans-serif" role="img" aria-label="UltraShot architecture: the conversion pipeline and the desktop application around it">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFD166"/><stop offset="1" stop-color="#FF7A00"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#9a9790" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#FFC14D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="560" rx="18" fill="#0b0b0d"/>

  <text x="40" y="44" fill="#f0eee8" font-size="17" font-weight="600">Conversion pipeline</text>
  <text x="40" y="64" fill="#9a9790" font-size="12">jxl2uhdr.py · pure Python and NumPy · the HDR data is only ever cropped and resized</text>

  <g font-size="12.5">
    <rect x="40" y="86" width="150" height="74" rx="12" fill="#1d1d24" stroke="#2c2c32"/>
    <text x="115" y="112" fill="#f0eee8" font-weight="600" text-anchor="middle">HDR capture</text>
    <text x="115" y="130" fill="#9a9790" text-anchor="middle">ReShade .jxl</text>
    <text x="115" y="146" fill="#9a9790" text-anchor="middle">NVIDIA / Game Bar .jxr</text>

    <rect x="224" y="86" width="150" height="74" rx="12" fill="#1d1d24" stroke="#2c2c32"/>
    <text x="299" y="112" fill="#f0eee8" font-weight="600" text-anchor="middle">Decode to nits</text>
    <text x="299" y="130" fill="#9a9790" text-anchor="middle">scRGB × 80</text>
    <text x="299" y="146" fill="#9a9790" text-anchor="middle">PQ / HLG curves</text>

    <rect x="408" y="86" width="150" height="74" rx="12" fill="#1d1d24" stroke="#2c2c32"/>
    <text x="483" y="112" fill="#f0eee8" font-weight="600" text-anchor="middle">Crop and resize</text>
    <text x="483" y="130" fill="#9a9790" text-anchor="middle">Lanczos, linear light</text>
    <text x="483" y="146" fill="#9a9790" text-anchor="middle">per output</text>

    <rect x="592" y="86" width="150" height="74" rx="12" fill="#1d1d24" stroke="#FFC14D"/>
    <text x="667" y="112" fill="#f0eee8" font-weight="600" text-anchor="middle">SDR base render</text>
    <text x="667" y="130" fill="#9a9790" text-anchor="middle">exposure, knee shoulder</text>
    <text x="667" y="146" fill="#9a9790" text-anchor="middle">hue-preserving, sRGB 8-bit</text>

    <rect x="592" y="184" width="150" height="54" rx="12" fill="#141418" stroke="#2c2c32"/>
    <text x="667" y="207" fill="#f0eee8" font-weight="600" text-anchor="middle">HDR layer</text>
    <text x="667" y="225" fill="#9a9790" text-anchor="middle">float16, 1.0 = 203 nits</text>

    <rect x="776" y="86" width="150" height="74" rx="12" fill="#1d1d24" stroke="#2c2c32"/>
    <text x="851" y="112" fill="#f0eee8" font-weight="600" text-anchor="middle">libultrahdr</text>
    <text x="851" y="130" fill="#9a9790" text-anchor="middle">full-res multi-channel</text>
    <text x="851" y="146" fill="#9a9790" text-anchor="middle">gain map, q100, 4:4:4</text>

    <rect x="776" y="184" width="150" height="54" rx="12" fill="#1d1d24" stroke="#FFC14D"/>
    <text x="851" y="207" fill="#f0eee8" font-weight="600" text-anchor="middle">Capacity match</text>
    <text x="851" y="225" fill="#9a9790" text-anchor="middle">peak = real max boost</text>

    <rect x="960" y="86" width="200" height="74" rx="12" fill="#1d1d24" stroke="#2c2c32"/>
    <text x="1060" y="112" fill="#f0eee8" font-weight="600" text-anchor="middle">Ultra HDR JPEG</text>
    <text x="1060" y="130" fill="#9a9790" text-anchor="middle">ISO 21496-1 + XMP hdrgm</text>
    <text x="1060" y="146" fill="#9a9790" text-anchor="middle">4K HDR\ and Insta\</text>

    <rect x="960" y="184" width="200" height="54" rx="12" fill="#141418" stroke="#2c2c32"/>
    <text x="1060" y="207" fill="#f0eee8" font-weight="600" text-anchor="middle">Verified by decoding</text>
    <text x="1060" y="225" fill="#9a9790" text-anchor="middle">reconstructed peak in the log</text>
  </g>

  <g fill="none" stroke="#9a9790" stroke-width="1.5" marker-end="url(#arr)">
    <path d="M190 123 H222"/>
    <path d="M374 123 H406"/>
    <path d="M558 123 H590"/>
    <path d="M742 123 H774"/>
    <path d="M926 123 H958"/>
    <path d="M558 123 C575 123 575 211 590 211"/>
    <path d="M742 211 H774"/>
  </g>
  <g fill="none" stroke="#FFC14D" stroke-width="1.5" marker-end="url(#arrg)">
    <path d="M851 160 V182"/>
    <path d="M926 211 C940 211 940 160 958 150"/>
    <path d="M1060 160 V182"/>
  </g>

  <text x="40" y="296" fill="#f0eee8" font-size="17" font-weight="600">Desktop application</text>
  <text x="40" y="316" fill="#9a9790" font-size="12">ultrashot.py · one process, a WebView2 window, a few worker threads</text>

  <g font-size="12.5">
    <rect x="40" y="338" width="250" height="170" rx="14" fill="#141418" stroke="#2c2c32"/>
    <text x="165" y="364" fill="#f0eee8" font-weight="600" text-anchor="middle">Interface</text>
    <text x="165" y="384" fill="#9a9790" text-anchor="middle">ui/index.html, app.css, app.js</text>
    <text x="165" y="402" fill="#9a9790" text-anchor="middle">rendered by Edge WebView2</text>
    <text x="165" y="430" fill="#FFC14D" text-anchor="middle">pywebview.api.* calls →</text>
    <text x="165" y="448" fill="#FFC14D" text-anchor="middle">← app.on(event, payload)</text>
    <text x="165" y="476" fill="#9a9790" text-anchor="middle">drag and drop, inspector,</text>
    <text x="165" y="492" fill="#9a9790" text-anchor="middle">settings page, log, toasts</text>

    <rect x="340" y="338" width="250" height="170" rx="14" fill="#1d1d24" stroke="#FFC14D"/>
    <text x="465" y="364" fill="#f0eee8" font-weight="600" text-anchor="middle">App core</text>
    <text x="465" y="384" fill="#9a9790" text-anchor="middle">file registry and statuses</text>
    <text x="465" y="402" fill="#9a9790" text-anchor="middle">settings.json (%APPDATA%)</text>
    <text x="465" y="420" fill="#9a9790" text-anchor="middle">preview cache (8 captures)</text>
    <text x="465" y="438" fill="#9a9790" text-anchor="middle">Api class exposed to the page</text>
    <text x="465" y="466" fill="#9a9790" text-anchor="middle">Startup shortcut, Explorer menu</text>
    <text x="465" y="484" fill="#9a9790" text-anchor="middle">single instance on 127.0.0.1:47811</text>

    <rect x="640" y="338" width="160" height="74" rx="12" fill="#1d1d24" stroke="#2c2c32"/>
    <text x="720" y="364" fill="#f0eee8" font-weight="600" text-anchor="middle">Thumbnail thread</text>
    <text x="720" y="382" fill="#9a9790" text-anchor="middle">decode once, cache,</text>
    <text x="720" y="398" fill="#9a9790" text-anchor="middle">live SDR previews</text>

    <rect x="640" y="434" width="160" height="74" rx="12" fill="#1d1d24" stroke="#2c2c32"/>
    <text x="720" y="460" fill="#f0eee8" font-weight="600" text-anchor="middle">Convert thread</text>
    <text x="720" y="478" fill="#9a9790" text-anchor="middle">one capture at a time</text>
    <text x="720" y="494" fill="#9a9790" text-anchor="middle">through the pipeline above</text>

    <rect x="830" y="338" width="160" height="74" rx="12" fill="#1d1d24" stroke="#2c2c32"/>
    <text x="910" y="364" fill="#f0eee8" font-weight="600" text-anchor="middle">Watch thread</text>
    <text x="910" y="382" fill="#9a9790" text-anchor="middle">polls folder + subfolders,</text>
    <text x="910" y="398" fill="#9a9790" text-anchor="middle">waits for stable files</text>

    <rect x="830" y="434" width="160" height="74" rx="12" fill="#1d1d24" stroke="#2c2c32"/>
    <text x="910" y="460" fill="#f0eee8" font-weight="600" text-anchor="middle">Tray (pystray)</text>
    <text x="910" y="478" fill="#9a9790" text-anchor="middle">open, watch toggle, quit,</text>
    <text x="910" y="494" fill="#9a9790" text-anchor="middle">notifications</text>

    <rect x="1020" y="338" width="140" height="170" rx="14" fill="#141418" stroke="#2c2c32"/>
    <text x="1090" y="364" fill="#f0eee8" font-weight="600" text-anchor="middle">Packaging</text>
    <text x="1090" y="390" fill="#9a9790" text-anchor="middle">PyInstaller onedir</text>
    <text x="1090" y="408" fill="#9a9790" text-anchor="middle">UltraShot.exe</text>
    <text x="1090" y="436" fill="#9a9790" text-anchor="middle">GitHub Actions:</text>
    <text x="1090" y="454" fill="#9a9790" text-anchor="middle">CI on push,</text>
    <text x="1090" y="472" fill="#9a9790" text-anchor="middle">release on v* tags</text>
  </g>

  <g fill="none" stroke="#FFC14D" stroke-width="1.5" marker-end="url(#arrg)" marker-start="url(#arrg)">
    <path d="M292 423 H338"/>
  </g>
  <g fill="none" stroke="#9a9790" stroke-width="1.5" marker-end="url(#arr)">
    <path d="M592 375 H638"/>
    <path d="M592 471 H638"/>
    <path d="M802 375 H828"/>
    <path d="M802 471 H828"/>
  </g>
</svg>
