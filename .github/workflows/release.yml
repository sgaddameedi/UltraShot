name: Release

# Builds UltraShot.exe and attaches it to the GitHub release when a v* tag is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)submit to winget, e.g. v1.2.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: cmd /c build_exe.bat -q
      - name: Zip
        run: Compress-Archive -Path dist\UltraShot\* -DestinationPath UltraShot-${{ github.ref_name }}-windows-x64.zip
      - name: Store package (MSIX, unsigned; upload it in Partner Center)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v") + ".0"
          .\packaging\msix\build_msix.ps1 -SkipBuild -Version $v `
            -IdentityName "SharathGaddameedi.UltraShot" `
            -Publisher "CN=787BFD2A-F573-4779-AC72-B51D76F8AA3F" `
            -PublisherDisplayName "Sharath Gaddameedi"
          Move-Item dist\UltraShot.msix "UltraShot-${{ github.ref_name }}.msix"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            UltraShot-${{ github.ref_name }}-windows-x64.zip
            UltraShot-${{ github.ref_name }}.msix
          generate_release_notes: true

  # Submits the new version to winget (microsoft/winget-pkgs) once the release exists.
  # Needs a repository secret WINGET_TOKEN: a classic personal access token with the
  # public_repo scope, from the account that owns the winget-pkgs fork.
  winget:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch') && !contains(github.event.inputs.tag || github.ref_name, '-') }}
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: sgaddameedi.UltraShot
          installers-regex: '\.zip$'
          release-tag: ${{ github.event.inputs.tag || github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
