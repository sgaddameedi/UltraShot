<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UltraShot</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="theme-dark">
<div id="aurora" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9.5" stroke-opacity=".3"/><circle cx="12" cy="12" r="6" stroke-opacity=".6"/><path d="M12 2.5a9.5 9.5 0 0 1 9.5 9.5"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div>
      <div class="title">UltraShot <span class="ver" id="ver"></span></div>
      <div class="sub">HDR screenshots → Ultra HDR JPEG for Instagram, phones &amp; browsers</div>
    </div>
  </div>
  <div class="topbar-right">
    <button id="watchPill" class="pill" title="Toggle the watch folder">
      <span class="dot"></span><span id="watchText">Watch folder off</span>
    </button>
    <button class="iconbtn" id="btnLog" title="Log">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
    </button>
    <button class="iconbtn" id="btnSettings" title="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <section id="empty" class="dropzone" tabindex="0">
    <div class="dz-inner">
      <div class="dz-icon">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
      </div>
      <h2>Drop HDR screenshots or folders here</h2>
      <p>or click to choose files · ReShade <b>.jxl</b> and NVIDIA / Game Bar <b>.jxr</b> captures</p>
      <div class="chips-row">
        <span class="tag">JPEG XL</span><span class="tag">JPEG XR</span><span class="tag">scRGB float</span><span class="tag">PQ 16-bit</span><span class="tag">HLG</span>
      </div>
    </div>
  </section>
  <section id="grid" class="grid hidden"></section>
</main>

<footer class="bottombar">
  <div class="chips">
    <button class="chip" id="chipOut"></button>
    <button class="chip" id="chipSave"></button>
    <button class="chip" id="chipLook"></button>
  </div>
  <div class="actions">
    <div id="progress" class="progress hidden"><div class="bar"><div class="fill"></div></div><span class="ptext"></span></div>
    <button class="ghost" id="btnAdd">Add files</button>
    <button class="ghost" id="btnClear">Clear</button>
    <button class="primary" id="btnConvert">Convert</button>
  </div>
</footer>

<aside id="inspector" class="inspector" aria-hidden="true">
  <div class="insp-head">
    <div class="insp-title" id="inspName">—</div>
    <button class="iconbtn small" id="inspClose" title="Close">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="insp-preview">
    <img id="inspImg" alt="">
    <div class="insp-loading" id="inspLoading"><span class="spinner"></span></div>
    <div class="insp-overlay" id="inspBadge"></div>
  </div>
  <div class="seg" id="inspTarget">
    <button data-v="full" class="on">Full size</button>
    <button data-v="ig">Instagram</button>
    <button data-v="heat">Highlights map</button>
  </div>
  <div class="insp-body">
    <div class="field">
      <div class="field-row"><label>Exposure <small>SDR base only</small></label><span class="val" id="vExposure"></span></div>
      <input type="range" id="rExposure" min="-3" max="3" step="0.05">
    </div>
    <div class="field">
      <div class="field-row"><label>Highlight knee <small>where roll-off starts</small></label><span class="val" id="vKnee"></span></div>
      <input type="range" id="rKnee" min="0.1" max="1" step="0.05">
    </div>
    <div class="field" id="cropFields">
      <div class="field-row"><label>Instagram crop</label></div>
      <div class="seg mini" id="inspCrop">
        <button data-v="none">Original</button><button data-v="4:5">4:5</button><button data-v="1:1">1:1</button><button data-v="16:9">16:9</button><button data-v="9:16">9:16</button><button data-v="1.91:1">1.91:1</button>
      </div>
      <div class="two">
        <div><div class="field-row"><label>Position X</label><span class="val" id="vCx"></span></div><input type="range" id="rCx" min="0" max="100" step="1"></div>
        <div><div class="field-row"><label>Position Y</label><span class="val" id="vCy"></span></div><input type="range" id="rCy" min="0" max="100" step="1"></div>
      </div>
    </div>
    <div class="info" id="inspInfo"></div>
    <div class="insp-actions">
      <button class="primary" id="inspConvert">Convert this</button>
      <button class="ghost" id="inspReveal">Show in folder</button>
      <button class="ghost danger" id="inspRemove">Remove</button>
    </div>
  </div>
</aside>

<div id="settings" class="page hidden">
  <div class="page-head">
    <button class="iconbtn" id="settingsBack" title="Back">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <h1>Settings</h1>
  </div>
  <div class="page-body" id="settingsBody"></div>
</div>

<div id="logdrawer" class="drawer hidden">
  <div class="drawer-head"><span>Log</span><div><button class="ghost tiny" id="btnLogClear">Clear</button><button class="iconbtn small" id="btnLogClose"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
  <pre id="logbody"></pre>
</div>

<div id="dragover" class="dragover"><div class="dragbox"><div class="dz-icon big">+</div><div>Drop to add</div></div></div>
<div id="popover" class="popover hidden"></div>
<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
